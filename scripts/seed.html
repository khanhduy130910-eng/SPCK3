<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Nạp dữ liệu mẫu · SPORTHUB</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!--
    Trang tiện ích dành cho admin: tạo nhanh danh mục + sản phẩm mẫu (kèm ảnh
    thật) trong Firestore để có dữ liệu thử nghiệm website.
    Chỉ tài khoản có role "admin" mới ghi được (Firestore Rules chặn phần còn lại).
    Dữ liệu nằm trong scripts/sample-data.js. Ảnh dùng URL Unsplash miễn phí;
    nếu ảnh lỗi, website tự thay bằng placeholder.
  -->
  <main class="container section" style="max-width:760px">
    <h1>Nạp dữ liệu mẫu</h1>
    <p class="text-muted">
      Tạo 4 danh mục (Giày / Áo / Quần / Phụ kiện) và <strong id="seed-count">…</strong>
      sản phẩm mẫu có ảnh trong Cloud Firestore. Sản phẩm/danh mục đã tồn tại (trùng tên)
      sẽ được bỏ qua nên có thể chạy lại nhiều lần.
    </p>
    <p>
      <button class="btn" type="button" id="seed-run">Nạp dữ liệu mẫu</button>
      <a class="btn btn--outline" href="../admin.html">Về trang quản trị</a>
    </p>
    <pre id="seed-log" class="panel" style="white-space:pre-wrap"></pre>
  </main>

  <script type="module">
    import {
      collection,
      addDoc,
      getDocs,
      serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { db, COLLECTIONS } from "../js/firebase-config.js";
    import { requireAdmin } from "../js/auth.js";
    import { slugify, reportError, setButtonLoading } from "../js/utils.js";
    import { SAMPLE_CATEGORIES, SAMPLE_PRODUCTS } from "./sample-data.js";

    const logEl = document.getElementById("seed-log");
    const log = (message) => {
      logEl.textContent += `${message}\n`;
    };

    document.getElementById("seed-count").textContent = String(SAMPLE_PRODUCTS.length);

    document.getElementById("seed-run").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      setButtonLoading(button, true, "Đang nạp...");
      try {
        const session = await requireAdmin();
        if (!session) return;

        // Đọc dữ liệu hiện có để bỏ qua bản ghi trùng tên.
        const [categorySnap, productSnap] = await Promise.all([
          getDocs(collection(db, COLLECTIONS.categories)),
          getDocs(collection(db, COLLECTIONS.products)),
        ]);
        const existingCategories = new Set(
          categorySnap.docs.map((item) => (item.data().name || "").trim().toLowerCase())
        );
        const existingProducts = new Set(
          productSnap.docs.map((item) => (item.data().name || "").trim().toLowerCase())
        );
        log(`Hiện có ${categorySnap.size} danh mục, ${productSnap.size} sản phẩm.`);

        let addedCategories = 0;
        for (const category of SAMPLE_CATEGORIES) {
          if (existingCategories.has(category.name.toLowerCase())) {
            log(`= Bỏ qua danh mục đã có: ${category.name}`);
            continue;
          }
          await addDoc(collection(db, COLLECTIONS.categories), {
            name: category.name,
            slug: slugify(category.name),
            description: category.description,
            image: category.image || "",
            active: true,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
          });
          addedCategories += 1;
          log(`+ Danh mục: ${category.name}`);
        }

        let addedProducts = 0;
        for (const product of SAMPLE_PRODUCTS) {
          if (existingProducts.has(product.name.toLowerCase())) {
            log(`= Bỏ qua sản phẩm đã có: ${product.name}`);
            continue;
          }
          const images = Array.isArray(product.images) ? product.images : [];
          await addDoc(collection(db, COLLECTIONS.products), {
            name: product.name,
            category: product.category,
            price: product.price,
            stock: product.stock,
            featured: Boolean(product.featured),
            active: true,
            description: product.description,
            image: images[0] || "",
            images,
            specs: product.specs || {},
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
          });
          addedProducts += 1;
          log(`+ Sản phẩm: ${product.name}`);
        }

        log(
          `Hoàn tất: thêm ${addedCategories} danh mục, ${addedProducts} sản phẩm. ` +
            "Mở lại trang chủ để xem dữ liệu."
        );
      } catch (error) {
        log(`Lỗi: ${reportError("seed/run", error, { silent: true })}`);
      } finally {
        setButtonLoading(button, false);
      }
    });
  </script>
</body>
</html>
