<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Giỏ hàng SPORTHUB - được lưu trên Cloud Firestore theo tài khoản.">
  <title>Giỏ hàng · SPORTHUB</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="container section">
    <div class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Trang chủ</a> / <span>Giỏ hàng</span>
      </nav>
      <h1>Giỏ hàng</h1>
      <p class="text-muted">
        Giỏ hàng được lưu trên Cloud Firestore (<code>Carts/{uid}</code>) nên đồng bộ
        trên mọi thiết bị khi bạn đăng nhập.
      </p>
    </div>

    <div class="two-col">
      <section>
        <div id="cart-list"></div>
        <p style="margin-top:16px">
          <button class="btn btn--ghost btn--sm hidden" type="button" id="cart-clear">
            Xoá toàn bộ giỏ hàng
          </button>
        </p>
      </section>

      <aside class="panel" aria-label="Tổng đơn hàng">
        <h2 class="panel__title">Tổng đơn</h2>
        <div id="cart-summary"></div>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    // Trang giỏ hàng: dựng header/footer rồi bật chế độ realtime của js/cart.js.
    import { renderHeader } from "./components/header.js";
    import { renderFooter } from "./components/footer.js";
    import { initChatbot } from "./js/chatbot.js";
    import { initCartPage } from "./js/cart.js";
    import { reportError } from "./js/utils.js";

    try {
      renderHeader();
      renderFooter();
      initChatbot();
      initCartPage();
    } catch (error) {
      reportError("cart/init", error);
    }
  </script>
</body>
</html>
