<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đăng nhập tài khoản SPORTHUB.">
  <title>Đăng nhập · SPORTHUB</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main">
    <div class="auth-wrap container">
      <section class="auth-card">
        <h1 class="auth-card__title">Đăng nhập</h1>
        <p class="text-muted">Đăng nhập để đồng bộ giỏ hàng và theo dõi đơn hàng.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email"
              autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label class="field__label" for="password">Mật khẩu</label>
            <input class="input" id="password" name="password" type="password"
              autocomplete="current-password" placeholder="••••••••" required>
          </div>
          <p class="field__error" id="login-error" role="alert"></p>
          <button class="btn btn--block btn--lg" type="submit">Đăng nhập</button>
        </form>

        <p class="text-center" style="margin-top:12px">
          <a href="#" id="forgot-password">Quên mật khẩu?</a>
        </p>

        <div class="divider"><span>hoặc</span></div>

        <button class="btn btn--outline btn--block" type="button" id="google-login">
          Đăng nhập bằng Google
        </button>

        <p class="text-center text-muted" style="margin-top:16px">
          Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
        </p>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
