<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đơn hàng của tôi tại SPORTHUB.">
  <title>Đơn hàng của tôi · SPORTHUB</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="container section">
    <div class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Trang chủ</a> / <span>Đơn hàng</span>
      </nav>
      <h1>Đơn hàng của tôi</h1>
      <p class="text-muted">Bạn chỉ thấy đơn hàng của chính tài khoản đang đăng nhập.</p>
    </div>

    <div class="toolbar">
      <label class="visually-hidden" for="orders-status">Lọc theo trạng thái</label>
      <select class="select" id="orders-status">
        <option value="">Tất cả trạng thái</option>
        <option value="pending">Chờ xác nhận</option>
        <option value="confirmed">Đã xác nhận</option>
        <option value="shipping">Đang giao</option>
        <option value="completed">Hoàn thành</option>
        <option value="cancelled">Đã huỷ</option>
      </select>
      <div class="toolbar__right">
        <a class="btn btn--outline btn--sm" href="products.html">Tiếp tục mua sắm</a>
      </div>
    </div>

    <div id="orders-list"></div>
    <div class="pagination" id="orders-pagination"></div>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/orders.js"></script>
</body>
</html>
